[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "componentlife-engine"
version = "0.1.0"
description = "ComponentLife degradation fingerprint and confidence engine proof of concept."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ComponentLife"}]
license = {text = "Proprietary Evaluation License"}
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
dashboard = ["streamlit>=1.40,<2", "plotly>=5.24,<7"]

[project.scripts]
componentlife-assess = "componentlife.cli:main"

[tool.setuptools.packages.find]
include = ["componentlife*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
